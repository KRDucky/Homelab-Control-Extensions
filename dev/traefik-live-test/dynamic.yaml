http:
  routers:
    hc-api:
      entryPoints: [hc-admin]
      rule: 'PathPrefix(`/api`)'
      service: api@internal
    fixture-router:
      entryPoints: [web]
      rule: 'Host(`fixture.localhost`) && Path(`/ping`)'
      service: fixture-service
      middlewares: [fixture-headers]
  services:
    fixture-service:
      loadBalancer:
        servers:
          - url: http://127.0.0.1:9081
  middlewares:
    fixture-headers:
      headers:
        customResponseHeaders:
          X-HomeControl-Fixture: phase4

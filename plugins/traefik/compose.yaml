name: homecontrol-traefik-dev
services:
  traefik-plugin:
    build: .
    image: homecontrol/traefik-plugin:dev
    user: "1000:1000"
    environment:
      TRAEFIK_API_ORIGIN: ${TRAEFIK_API_ORIGIN:?Set the reviewed private Traefik API origin}
      HC_HELPER_TOKEN_FILE: /run/secrets/helper_token
    secrets:
      - helper_token
    networks:
      - traefik-test
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.5
    restart: "no"
    # No host ports and no Docker socket. Core adapter joins this network after review.
networks:
  traefik-test:
    external: true
    name: ${TRAEFIK_TEST_NETWORK:?Set an existing dedicated internal Docker network}
secrets:
  helper_token:
    file: ${HC_HELPER_TOKEN_FILE:?Set a local token file outside this repository}
